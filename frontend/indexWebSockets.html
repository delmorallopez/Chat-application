<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App (WebSockets)</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 0 12px; }
    h1 { text-align: center; }
    #connection-status { text-align: center; margin-bottom: 14px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 20px; }
    .message { padding: 8px 5px; border-bottom: 1px solid #eee; overflow-wrap: anywhere; }
    .author { font-weight: bold; }
    .message-text { white-space: pre-wrap; }
    form { display: flex; gap: 5px; }
    input { flex: 1; min-width: 0; padding: 8px; }
    button { padding: 6px 10px; margin-left: 5px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Chat App (WebSockets)</h1>
  <p id="connection-status" role="status" aria-live="polite">Connecting...</p>
  <div id="chat" aria-live="polite"></div>
  <form id="message-form">
    <input id="author-input" placeholder="Your name" required />
    <input id="message-input" placeholder="Type a message..." required />
    <button type="submit" id="send-btn" disabled>Send</button>
  </form>
  <script>
    const WS_URL = "wss://yoly9k5o1uv81ympylbvpcuc.grads.hosting.cyf.academy";
    const chatDiv = document.getElementById("chat");
    const form = document.getElementById("message-form");
    const authorInput = document.getElementById("author-input");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const connectionStatus = document.getElementById("connection-status");

    function renderMessage(msg) {
      if (document.getElementById(`msg-${msg.id}`)) { updateMessage(msg); return; }
      const div = document.createElement("div");
      div.className = "message";
      div.id = `msg-${msg.id}`;
      const author = document.createElement("span");
      author.className = "author";
      author.textContent = `${msg.author}: `;
      const text = document.createElement("span");
      text.className = "message-text";
      text.textContent = msg.text;
      const reactions = document.createElement("div");
      const likeCount = document.createElement("span");
      likeCount.id = `like-${msg.id}`;
      likeCount.textContent = `👍 ${msg.likes}`;
      const likeButton = document.createElement("button");
      likeButton.type = "button";
      likeButton.className = "like";
      likeButton.dataset.id = msg.id;
      likeButton.textContent = "Like";
      const dislikeCount = document.createElement("span");
      dislikeCount.id = `dislike-${msg.id}`;
      dislikeCount.textContent = `👎 ${msg.dislikes}`;
      const dislikeButton = document.createElement("button");
      dislikeButton.type = "button";
      dislikeButton.className = "dislike";
      dislikeButton.dataset.id = msg.id;
      dislikeButton.textContent = "Dislike";
      reactions.append(likeCount, likeButton, dislikeCount, dislikeButton);
      div.append(author, text, reactions);
      chatDiv.appendChild(div);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function updateMessage(msg) {
      const like = document.getElementById(`like-${msg.id}`);
      const dislike = document.getElementById(`dislike-${msg.id}`);
      if (like) like.textContent = `👍 ${msg.likes}`;
      if (dislike) dislike.textContent = `👎 ${msg.dislikes}`;
    }

    const socket = new WebSocket(WS_URL); // Automatically connect on page load.
    socket.onopen = () => {
      connectionStatus.textContent = "● Connected (WebSocket)";
      sendBtn.disabled = false;
    };
    socket.onmessage = event => {
      let data;
      try { data = JSON.parse(event.data); } catch (error) { console.error(error); return; }
      if (data.type === "init") {
        chatDiv.innerHTML = "";
        data.messages.forEach(renderMessage);
      } else if (data.type === "message") {
        renderMessage(data.message);
      } else if (data.type === "update") {
        updateMessage(data.message);
      }
    };
    socket.onerror = error => {
      console.error("WebSocket error:", error);
      connectionStatus.textContent = "Connection error — refresh to retry";
      sendBtn.disabled = true;
    };
    socket.onclose = () => {
      connectionStatus.textContent = "Disconnected — refresh to retry";
      sendBtn.disabled = true;
    };

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (socket.readyState !== WebSocket.OPEN) return;
      const author = authorInput.value.trim();
      const text = messageInput.value.trim();
      if (!author || !text) return;
      socket.send(JSON.stringify({ type: "message", author, text }));
      messageInput.value = "";
    });

    chatDiv.addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (!button || socket.readyState !== WebSocket.OPEN) return;
      const id = Number(button.dataset.id);
      const type = button.classList.contains("like") ? "like" : "dislike";
      socket.send(JSON.stringify({ type, id }));
    });
  </script>
</body>
</html>
